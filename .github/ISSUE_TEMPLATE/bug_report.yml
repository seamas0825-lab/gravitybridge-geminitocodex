name: Bug report
description: Report a defect in the GravityBridge CLI, dashboard, Antigravity connection, or packaging.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Include a minimal reproduction and exact environment details so we can confirm and fix the problem quickly.

  - type: dropdown
    id: client
    attributes:
      label: Client or integration
      description: Which client or surface did you observe the problem in?
      options:
        - Codex CLI
        - Codex App
        - GravityBridge dashboard
        - Other
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of GravityBridge is affected?
      options:
        - CLI
        - Proxy and routing
        - Dashboard
        - Google sign-in
        - Antigravity model verification
        - Codex configuration or restoration
        - Installation or packaging
        - Platform (macOS)
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
      placeholder: The proxy returns 502 when ...; I expected ...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: |
        Exact commands, steps, configuration shape, and inputs. If the problem is intermittent or not yet consistently reproducible, explain what you have observed and under which conditions.
      placeholder: |
        1. gravitybridge start --port 10100
        2. Sign in and run the verification test
        3. Observe ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Installed GravityBridge version or commit SHA.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: OS name and version.
      placeholder: macOS 15.5
    validations:
      required: true

  - type: input
    id: provider-model
    attributes:
      label: Advertised model
      description: The Antigravity model shown in the dashboard, if relevant.
      placeholder: "google-antigravity/gemini-3.7-flash"

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Paste relevant logs, stack traces, or request IDs.
      render: shell

  - type: textarea
    id: attachments
    attributes:
      label: Screenshots and supporting files
      description: Drag screenshots, videos, logs, or minimal reproduction archives here.

  - type: textarea
    id: config
    attributes:
      label: Redacted configuration
      description: Share a redacted config snippet if the bug depends on Codex routing. Never include OAuth credentials.
      render: json

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and documentation.
          required: true
        - label: I removed secrets, tokens, account details, request credentials, and personal data.
          required: true
