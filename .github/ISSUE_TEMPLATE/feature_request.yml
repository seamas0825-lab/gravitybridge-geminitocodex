name: Feature proposal
description: Propose a focused workflow improvement for GravityBridge.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the GravityBridge workflow you need. Concrete examples help us evaluate the proposal.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of GravityBridge does this proposal affect?
      options:
        - CLI
        - Proxy and routing
        - Dashboard
        - Google sign-in
        - Antigravity model verification
        - Codex configuration or restoration
        - Installation or packaging
        - Platform (macOS)
        - Documentation
        - Multiple areas
        - Other
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: What are you trying to accomplish?
      description: Describe the user workflow or outcome you need.
      placeholder: I need to route requests from ... so that ...
    validations:
      required: true

  - type: textarea
    id: blocker
    attributes:
      label: What prevents this today?
      description: What is the current limitation, missing capability, or inefficient workaround?
      placeholder: Currently the proxy does not support ...
    validations:
      required: true

  - type: textarea
    id: behaviour
    attributes:
      label: What should GravityBridge do?
      description: Describe the observable behaviour you expect, not internal implementation details.
      placeholder: When I send ... the proxy should ...
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example usage or interface
      description: |
        Provide at least one concrete example: a CLI command, configuration fragment, API exchange, UI workflow, or before/after comparison.
      placeholder: |
        ```bash
        gravitybridge doctor
        ```
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: What workarounds or competing approaches have you tried or considered?

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Related issues, upstream specifications, screenshots, or design references.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and documentation.
          required: true
        - label: This request describes a concrete GravityBridge workflow rather than merely naming a desired technology.
          required: true
        - label: I removed secrets and personal data.
          required: true
