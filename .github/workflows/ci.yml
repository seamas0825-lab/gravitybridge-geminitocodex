name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-platform:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-project-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: GravityBridge tests
        run: bun test tests/gravitybridge-core.test.ts tests/gravitybridge-routes.test.ts

  product-suite:
    name: Product suite and web app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-project-bun

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd gui
          bun install --frozen-lockfile

      - name: Runtime tests
        run: bun run test

      - name: Privacy scan
        run: bun run privacy:scan

      - name: GUI lint
        working-directory: gui
        run: bun run lint

      - name: GUI tests
        working-directory: gui
        run: bun test tests

      - name: Build product dashboard
        working-directory: gui
        env:
          VITE_GRAVITYBRIDGE_MODE: "1"
        run: bun run build:gravitybridge

  package-smoke:
    name: Package smoke (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-project-bun

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install and build
        run: |
          bun install --frozen-lockfile
          cd gui
          bun install --frozen-lockfile
          bun run build:gravitybridge
          cd ..
          bun run prepare:package

      - name: Pack and install CLI
        shell: bash
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          package_tarball="$(find "$RUNNER_TEMP" -maxdepth 1 -name 'gravitybridge-*.tgz' -print -quit)"
          test -n "$package_tarball"
          npm install --global --prefix "$RUNNER_TEMP/install" "$package_tarball"
          "$RUNNER_TEMP/install/bin/gravitybridge" --version
          "$RUNNER_TEMP/install/bin/gravitybridge" --help
